services:
  postgres:
    image: postgres:16-alpine
    container_name: meskot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meskot
      POSTGRES_PASSWORD: meskot_dev_password
      POSTGRES_DB: meskot_db
    ports:
      - "5432:5432"
    volumes:
      - meskot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meskot -d meskot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meskot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - meskot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: meskot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meskot_minio
      MINIO_ROOT_PASSWORD: meskot_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - meskot_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: meskot-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 meskot_minio meskot_minio_secret;
      mc mb -p local/meskot-media || true;
      mc anonymous set download local/meskot-media || true;
      exit 0;
      "

volumes:
  meskot_pg_data:
  meskot_redis_data:
  meskot_minio_data:
